name: ETF Close Sync (Daily)

on:
  schedule:
    # 16:00 KST = 07:00 UTC (당일). KST 평일(월~금) = UTC(월~금) 07:00 → day-of-week 1-5.
    - cron: '0 7 * * 1-5'
  workflow_dispatch:

permissions:
  id-token: write   # Infisical OIDC 인증에 필요
  contents: read    # 코드 체크아웃에 필요

jobs:
  close-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: collector

    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: "oidc"
          identity-id: "777067a6-906b-4e4f-adbd-49e77a0cf96f"   # Infisical Machine Identity ID
          project-slug: "etfy-m-vtv"       # Infisical 프로젝트 slug
          env-slug: "prod"                        # prod KIS·Supabase 사용
          # 가져온 시크릿은 기본(export-type: env)으로 이후 스텝의 환경변수로 주입된다.

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run daily close (enrich_etf_info, sync_etf_price, sync_etf_constituent)
        run: uv run etf-collector --close-once
