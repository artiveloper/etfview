name: ETF Collector Deploy

on:
  push:
    branches: [main]
    paths:
      - 'collector/**'
  workflow_dispatch:

permissions:
  id-token: write   # Infisical OIDC 인증에 필요
  contents: read    # 코드 체크아웃에 필요
  packages: write   # GHCR 이미지 푸시에 필요

env:
  IMAGE: ghcr.io/artiveloper/etfy-collector

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: collector
          push: true
          tags: ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: "oidc"
          identity-id: "777067a6-906b-4e4f-adbd-49e77a0cf96f"   # Infisical Machine Identity ID
          project-slug: "etfy-m-vtv"       # Infisical 프로젝트 slug
          env-slug: "prod"                        # prod KIS·Supabase 사용

      - name: Write .env
        run: |
          cat > .env <<EOF
          KIS_APP_KEY=${KIS_APP_KEY}
          KIS_APP_SECRET=${KIS_APP_SECRET}
          KIS_ENV=${KIS_ENV}
          KRX_USERNAME=${KRX_USERNAME}
          KRX_PASSWORD=${KRX_PASSWORD}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
          EOF

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Ensure deploy directory exists
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /app/etfy/etfy-collector/logs'

      - name: Copy deploy files to server
        run: scp docker-compose.yml .env "$DEPLOY_USER@$DEPLOY_HOST:/app/etfy/etfy-collector/"

      - name: Pull image and restart container
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /app/etfy/etfy-collector && docker compose pull && docker compose up -d --remove-orphans'
